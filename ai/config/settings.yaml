models:
  llm:
    provider: ollama
    model: llama3.2:1b
    host: http://localhost:11434
  vlm:
    provider: ollama
    model: moondream2
  stt:
    provider: whisper
    model: base
  tts:
    provider: piper
    model: "ai/tts/models/en_GB-semaine-medium.onnx"
    speaker: null
    sample_rate: 22050
    executable: piper
    stream_wav_chunks: true

network:
  host: 0.0.0.0
  ws_port: 8001
  http_port: 8000

features:
  use_vad: false
  enable_memory: true
  enable_safety_filter: true
  allow_cloud_models: false
