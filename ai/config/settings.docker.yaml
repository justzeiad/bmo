models:
  llm:
    provider: ollama
    model: llama3.2:1b
    host: http://ollama:11434
    keep_alive: "30m"
    options:
      temperature: 0.22
      top_p: 0.88
      repeat_penalty: 1.1
      num_predict: 56
      num_ctx: 1536
    warmup: true
    warmup_prompt: "ping"
  vlm:
    provider: ollama
    model: moondream2
  stt:
    provider: whisper
    model: tiny.en
    device: cpu
    compute_type: int8
    sample_rate: 16000
    partial_seconds: 0.5
    max_partial_seconds: 8.0
    language: en
    warmup: true
    warmup_seconds: 1.0
  tts:
    provider: piper
    model: "ai/tts/models/en_US-bmo_voice.onnx"
    speaker: null
    sample_rate: 22050
    executable: piper
    split_sentences: false
    length_scale: 1.08
    noise_scale: 0.45
    noise_w_scale: 0.55
    volume: 0.95
    stream_wav_chunks: false
    ws_chunk_bytes: 4096

network:
  host: 0.0.0.0
  ws_port: 8001
  http_port: 8000

features:
  use_vad: false
  enable_memory: false
  enable_safety_filter: false
  allow_cloud_models: false
