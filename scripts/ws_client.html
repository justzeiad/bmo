<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BMO Voice Chat</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 24px; }
    input, button, textarea { font: inherit; }
    #log { width: 100%; height: 260px; }
    .row { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #status { font-weight: 700; }
  </style>
</head>
<body>
  <h1>BMO Voice Chat</h1>

  <div class="row">
    <label>WS URL: <input id="wsUrl" size="40" value="ws://localhost:8000/ws"></label>
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <span id="status">offline</span>
  </div>

  <div class="row">
    <label>Text: <input id="textInput" size="60" placeholder="Say something"></label>
    <button id="sendBtn" disabled>Send</button>
  </div>

  <div class="row">
    <button id="startMicBtn" disabled>Start Talking</button>
    <button id="stopMicBtn" disabled>Stop Talking</button>
    <label><input type="checkbox" id="autoEndpoint" checked> Auto end on silence</label>
    <span id="micState">mic idle</span>
  </div>

  <div class="row">
    <strong>Transcript:</strong> <span id="transcript"></span>
  </div>

  <div class="row">
    <strong>Expression:</strong> <span id="expression"></span>
  </div>

  <textarea id="log" readonly></textarea>

  <script>
    let ws = null;
    let audioCtx = null;
    let nextPlayTime = 0;

    let micStream = null;
    let micSource = null;
    let micProcessor = null;
    let talking = false;

    let silenceTimer = null;
    let lastSpeechAt = 0;
    let startedTalkingAt = 0;

    const TARGET_SAMPLE_RATE = 16000;
    const MIC_BUFFER_SIZE = 4096;
    const SILENCE_MS = 900;
    const MIN_TURN_MS = 700;
    const SPEECH_RMS_THRESHOLD = 0.012;

    const el = (id) => document.getElementById(id);

    const log = (msg) => {
      const t = el('log');
      t.value += msg + "\n";
      t.scrollTop = t.scrollHeight;
    };

    const setStatus = (text) => {
      el('status').textContent = text;
    };

    const setMicState = (text) => {
      el('micState').textContent = text;
    };

    const setConnected = (connected) => {
      el('connectBtn').disabled = connected;
      el('disconnectBtn').disabled = !connected;
      el('sendBtn').disabled = !connected;
      el('startMicBtn').disabled = !connected || talking;
      el('stopMicBtn').disabled = !connected || !talking;
      setStatus(connected ? 'connected' : 'offline');
    };

    function rms(samples) {
      let total = 0;
      for (let i = 0; i < samples.length; i++) {
        total += samples[i] * samples[i];
      }
      return Math.sqrt(total / samples.length);
    }

    function downsampleFloatToInt16(float32Array, inSampleRate, outSampleRate) {
      if (outSampleRate > inSampleRate) {
        throw new Error('Output sample rate must be <= input sample rate');
      }
      const ratio = inSampleRate / outSampleRate;
      const outLength = Math.floor(float32Array.length / ratio);
      const result = new Int16Array(outLength);
      let offsetResult = 0;
      let offsetBuffer = 0;

      while (offsetResult < outLength) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < float32Array.length; i++) {
          accum += float32Array[i];
          count += 1;
        }
        const sample = count > 0 ? accum / count : 0;
        const s = Math.max(-1, Math.min(1, sample));
        result[offsetResult] = s < 0 ? s * 0x8000 : s * 0x7fff;
        offsetResult += 1;
        offsetBuffer = nextOffsetBuffer;
      }

      return result;
    }

    function stopSilenceWatcher() {
      if (silenceTimer) {
        clearInterval(silenceTimer);
        silenceTimer = null;
      }
    }

    function startSilenceWatcher() {
      stopSilenceWatcher();
      silenceTimer = setInterval(() => {
        if (!talking || !el('autoEndpoint').checked) return;
        const now = Date.now();
        const silentFor = now - lastSpeechAt;
        const turnFor = now - startedTalkingAt;
        if (turnFor >= MIN_TURN_MS && silentFor >= SILENCE_MS) {
          stopMic();
        }
      }, 100);
    }

    async function startMic() {
      if (!ws || ws.readyState !== WebSocket.OPEN || talking) return;

      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });
      micSource = audioCtx.createMediaStreamSource(micStream);
      micProcessor = audioCtx.createScriptProcessor(MIC_BUFFER_SIZE, 1, 1);

      startedTalkingAt = Date.now();
      lastSpeechAt = startedTalkingAt;

      micProcessor.onaudioprocess = (event) => {
        if (!talking || !ws || ws.readyState !== WebSocket.OPEN) return;
        const input = event.inputBuffer.getChannelData(0);
        const level = rms(input);
        if (level > SPEECH_RMS_THRESHOLD) {
          lastSpeechAt = Date.now();
        }

        const pcm16 = downsampleFloatToInt16(input, audioCtx.sampleRate, TARGET_SAMPLE_RATE);
        ws.send(pcm16.buffer);
      };

      micSource.connect(micProcessor);
      micProcessor.connect(audioCtx.destination);

      ws.send(JSON.stringify({ type: 'start_speech' }));
      talking = true;
      setMicState('listening');
      setConnected(true);
      startSilenceWatcher();
      log('mic started');
    }

    function stopMic() {
      if (!talking) return;
      talking = false;
      stopSilenceWatcher();

      if (micProcessor) {
        micProcessor.disconnect();
        micProcessor.onaudioprocess = null;
        micProcessor = null;
      }
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      if (micStream) {
        micStream.getTracks().forEach((t) => t.stop());
        micStream = null;
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'end_speech' }));
      }

      setMicState('mic idle');
      setConnected(true);
      log('mic stopped');
    }

    el('connectBtn').onclick = () => {
      const url = el('wsUrl').value;
      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        setConnected(true);
        log('connected');
        ws.send(JSON.stringify({ type: 'open_session', sessionId: 'web', userId: 'web' }));
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        nextPlayTime = audioCtx.currentTime;
      };

      ws.onclose = () => {
        stopMic();
        setConnected(false);
        log('disconnected');
      };

      ws.onmessage = async (evt) => {
        if (typeof evt.data !== 'string') return;

        const payload = JSON.parse(evt.data);
        const type = payload.type;

        if (type === 'transcript_partial' || type === 'transcript_final') {
          el('transcript').textContent = payload.text || '';
        }
        if (type === 'expression') {
          el('expression').textContent = JSON.stringify(payload);
        }
        if (type === 'tts_chunk') {
          const data = payload.data || '';
          const buffer = Uint8Array.from(atob(data), (c) => c.charCodeAt(0)).buffer;
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = await audioCtx.decodeAudioData(buffer.slice(0));
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          const startTime = Math.max(nextPlayTime, audioCtx.currentTime);
          source.start(startTime);
          nextPlayTime = startTime + audioBuffer.duration;
          return;
        }

        log(JSON.stringify(payload));
      };
    };

    el('disconnectBtn').onclick = () => {
      if (ws) ws.close();
    };

    el('sendBtn').onclick = () => {
      const text = el('textInput').value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'text_input', text }));
    };

    el('startMicBtn').onclick = async () => {
      try {
        await startMic();
      } catch (err) {
        log(`mic error: ${String(err)}`);
        stopMic();
      }
    };

    el('stopMicBtn').onclick = () => {
      stopMic();
    };
  </script>
</body>
</html>
